name: build

on:
  push:
    branches: [master, personal-hardening]
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships the Android SDK; only the NDK/CMake for the ALAC encoder are added.
      - name: Install NDK and CMake (ALAC encoder)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      # Personal fork: decode the fixed signing key (skipped when the secret is absent).
      - name: Decode signing key
        if: env.SIGNING_KEYSTORE_B64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.p12"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/signing.p12" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Print signing certificate
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: centuryplay-debug
          path: app/build/outputs/apk/debug/app-debug.apk
